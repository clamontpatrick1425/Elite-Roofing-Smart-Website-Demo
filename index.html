
<!DOCTYPE html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Elite Roofing Solutions offers premier AI-powered roofing services. WCAG 2.1 AA compliant and ADA accessible for all homeowners." />
    <title>Elite Roofing Solutions | AI-Powered Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              blue: {
                // Ensuring AA/AAA contrast ratios for text
                600: '#1d4ed8',
                700: '#1e40af', 
                800: '#1e3a8a',
              }
            }
          }
        }
      }
    </script>

  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>
<script>
  (function() {
    try {
      const theme = localStorage.getItem('theme');
      const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && supportDarkMode)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  /* Accessibility focus styles */
  :focus-visible {
    outline: 3px solid #2563eb !important;
    outline-offset: 4px !important;
    border-radius: 4px;
  }
  
  /* Skip Link for Keyboard Users */
  .skip-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: #1d4ed8;
    color: white;
    padding: 8px;
    z-index: 100;
    transition: top 0.3s;
  }
  .skip-link:focus {
    top: 0;
  }

  @media print {
    body * { visibility: hidden; }
    #appointment-confirmation, #appointment-confirmation * { visibility: visible; }
    #appointment-confirmation { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none !important; border: none !important; }
    .no-print { display: none !important; }
  }
</style>
</head>
